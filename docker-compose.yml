services:
  postgres:
    image: postgres:16-alpine
    container_name: openpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openpulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openpulse-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: openpulse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-openpulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP API
      - "9000:9000" # Native TCP client
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openpulse-net

networks:
  openpulse-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  chdata:
    driver: local
