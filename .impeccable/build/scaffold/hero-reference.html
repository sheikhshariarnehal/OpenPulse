<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pliant:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#191a1d}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-nav-logo region text" data-region="nav-logo"><!-- OpenPulse brand logo and title --><p style="font-size:var(--r-nav-logo-font);line-height:1.05;margin:0">nav-logo</p></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- primary navigation icon buttons for Events, Statistics, Users, Errors: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-links); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-shortcuts region control" data-region="nav-shortcuts"><!-- shortcuts menu list for Events, Dashboard, and Department: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-shortcuts); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-top-title region text" data-region="top-title"><!-- Events Dashboard page title --><p style="font-size:var(--r-top-title-font);font-family:var(--r-top-title-family),sans-serif;font-weight:var(--r-top-title-weight);line-height:1.05;margin:0">top-title</p></div>
  <div class="r-top-controls region control" data-region="top-controls"><!-- dropdown selectors for Event Shortcut and All Events filter: rebuild the control's chrome from the crop (comp-spec.mjs --crop top-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-throughput-title region text" data-region="throughput-title"><!-- Event Throughput headline and sub-millisecond sparkline subtitle --><p style="font-size:var(--r-throughput-title-font);line-height:1.05;margin:0">throughput-title</p></div>
  <div class="r-throughput-chart region control" data-region="throughput-chart"><!-- interactive runtime telemetry sparkline chart with graticule grid and cyan-emerald pulse trace: rebuild the control's chrome from the crop (comp-spec.mjs --crop throughput-chart); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-kpi-latency region control" data-region="kpi-latency"><!-- Ingestion Latency KPI metric card displaying 0.42ms: rebuild the control's chrome from the crop (comp-spec.mjs --crop kpi-latency); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-kpi-events region control" data-region="kpi-events"><!-- Events per sec KPI metric card displaying 32,480/s: rebuild the control's chrome from the crop (comp-spec.mjs --crop kpi-events); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-kpi-clusters region control" data-region="kpi-clusters"><!-- Active Clusters KPI metric card displaying 8: rebuild the control's chrome from the crop (comp-spec.mjs --crop kpi-clusters); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-kpi-error-rate region control" data-region="kpi-error-rate"><!-- Error Rate KPI metric card displaying 0.02%: rebuild the control's chrome from the crop (comp-spec.mjs --crop kpi-error-rate); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-table-title region text" data-region="table-title"><!-- Live event stream section title --><p style="font-size:var(--r-table-title-font);line-height:1.05;margin:0">table-title</p></div>
  <div class="r-table-filter region control" data-region="table-filter"><!-- live event stream search and filter input: rebuild the control's chrome from the crop (comp-spec.mjs --crop table-filter); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-table-header region chrome" data-region="table-header"><!-- table column headers for Timestamp, Status, and Event name --></div>
  <div class="r-table-rows region control" data-region="table-rows"><!-- dense live event rows with millisecond timestamps, status pills (200 OK, 202 ACCEPTED), and event names: rebuild the control's chrome from the crop (comp-spec.mjs --crop table-rows); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
